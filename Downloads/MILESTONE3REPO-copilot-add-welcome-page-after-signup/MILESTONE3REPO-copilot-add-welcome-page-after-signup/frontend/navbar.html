<form id="searchForm" style="display:inline;">
  <input type="text" id="searchInput" placeholder="Search products..." style="padding:4px 8px; border-radius:4px; border:1px solid #ccc;" />
  <button type="submit" id="searchBtn" style="background:none; border:none; cursor:pointer;">
    <img src="/icons/search.svg" alt="Search" style="width:20px; vertical-align:middle;" />
  </button>
</form>
<!-- ...existing navbar code... -->
<script>
document.getElementById('searchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var q = document.getElementById('searchInput').value.trim();
  if(q) window.location.href = '/search.html?q=' + encodeURIComponent(q);
});
</script>
